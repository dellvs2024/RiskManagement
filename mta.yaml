_schema-version: 3.3.0
ID: riskmanagement
description: A simple CAP project.
version: 1.0.0
modules:
  - name: riskmanagement-srv
    type: nodejs
    path: gen/srv
    requires:
      - name: riskmanagement-db
      - name: uaa_riskmanagement
      - name: riskmanagement-destination-service
    provides:
      - name: srv-risk
        properties:
          srv-url: ${default-url}
    parameters:
      buildpack: nodejs_buildpack
      instances: 1
    build-parameters:
      builder: npm-ci
  - name: riskmanagement-db-deployer
    type: hdb
    path: gen/db
    requires:
      - name: riskmanagement-db
    parameters:
      buildpack: nodejs_buildpack
  - name: riskmanagement-destination-content
    type: com.sap.application.content
    requires:
      - name: riskmanagement-destination-service
        parameters:
          content-target: true
      - name: riskmanagement_html_repo_host
        parameters:
          service-key:
            name: riskmanagement_html_repo_host-key
      - name: uaa_riskmanagement
        parameters:
          service-key:
            name: uaa_riskmanagement-key
    parameters:
      content:
        instance:
          destinations:
            - Name: riskmanagement_riskmanagement_html_repo_host
              ServiceInstanceName: riskmanagement-html5-app-host-service
              ServiceKeyName: riskmanagement_html_repo_host-key
              sap.cloud.service: riskmanagement
            - Authentication: OAuth2UserTokenExchange
              Name: riskmanagement_uaa_riskmanagement
              ServiceInstanceName: riskmanagement-xsuaa-service
              ServiceKeyName: uaa_riskmanagement-key
              sap.cloud.service: riskmanagement
          existing_destinations_policy: ignore
    build-parameters:
      no-source: true
  - name: riskmanagement-app-content
    type: com.sap.application.content
    path: .
    requires:
      - name: riskmanagement_html_repo_host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - artifacts:
            - riskmanagementrisks.zip
          name: riskmanagementrisks
          target-path: resources/
  - name: riskmanagementrisks
    type: html5
    path: app/risks
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms:
        []
resources:
  - name: riskmanagement-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: riskmanagement-destination-service
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            destinations:
              - Authentication: NoAuthentication
                Name: ui5
                ProxyType: Internet
                Type: HTTP
                URL: https://ui5.sap.com
            existing_destinations_policy: update
        version: 1.0.0
      service: destination
      service-name: riskmanagement-destination-service
      service-plan: lite
  - name: riskmanagement_html_repo_host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-name: riskmanagement-html5-app-host-service
      service-plan: app-host
  - name: uaa_riskmanagement
    type: org.cloudfoundry.managed-service
    parameters:
      path: ./xs-security.json
      service: xsuaa
      service-name: riskmanagement-xsuaa-service
      service-plan: application
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
